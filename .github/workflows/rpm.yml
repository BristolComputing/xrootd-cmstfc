name: Build RPM

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rpm:
    runs-on: ubuntu-latest
    container:
      image: quay.io/rockylinux/rockylinux:9

    steps:
      - uses: actions/checkout@v4

      - name: Install build tooling
        run: |
          dnf -y install epel-release dnf-plugins-core
          dnf -y config-manager --add-repo https://xrootd.web.cern.ch/xrootd/repo/stable/el9/x86_64/
          cat > /etc/yum.repos.d/xrootd-stable.repo <<'EOF'
          [xrootd-stable]
          name=XRootD Stable repository
          baseurl=https://xrootd.web.cern.ch/xrootd/repo/stable/el9/$basearch/
          gpgcheck=0
          enabled=1
          EOF
          dnf -y install \
            rpm-build rpmdevtools \
            gcc-c++ make cmake git \
            xrootd-devel xrootd-server-devel \
            xerces-c-devel pcre-devel \
            rsync
          dnf clean all

      - name: Prepare rpmbuild tree
        run: |
          rpmdev-setuptree
          VERSION="$(grep -E '^Version:' spec/xrootd-cmstfc.spec | awk '{print $2}')"
          NAME="$(grep -E '^Name:' spec/xrootd-cmstfc.spec | awk '{print $2}')"
          mkdir -p "/tmp/${NAME}-${VERSION}"
          rsync -a \
            --exclude='.git' \
            --exclude='build' \
            --exclude='.github' \
            ./ "/tmp/${NAME}-${VERSION}/"
          cp spec/xrootd-cmstfc.spec "$HOME/rpmbuild/SPECS/"
          tar -C /tmp -czf "$HOME/rpmbuild/SOURCES/${NAME}.tar.gz" \
            "${NAME}-${VERSION}"
          tar -tzf "$HOME/rpmbuild/SOURCES/${NAME}.tar.gz" | head
      - name: Build RPM
        run: |
          rpmbuild -ba "$HOME/rpmbuild/SPECS/xrootd-cmstfc.spec"

      - name: Inspect RPM
        run: |
          rpm -qpi "$HOME"/rpmbuild/RPMS/x86_64/*.rpm
          rpm -qpl "$HOME"/rpmbuild/RPMS/x86_64/*.rpm
          rpm -qpR "$HOME"/rpmbuild/RPMS/x86_64/*.rpm

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xrootd-cmstfc-el9-rpms
          path: |
            ~/rpmbuild/RPMS/**/*.rpm
            ~/rpmbuild/SRPMS/**/*.rpm

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            /root/rpmbuild/RPMS/**/*.rpm
            /root/rpmbuild/SRPMS/**/*.rpm